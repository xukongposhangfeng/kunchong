<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐛 昆虫人格测试</title>
    <style>
        /* ========== 全局样式重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== 页面基础样式 - 丛林暗绿色调 ========== */
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(180deg, #0a1f0a 0%, #1a3a1a 50%, #0d2818 100%);
            min-height: 100vh;
            color: #e8f5e8;
            line-height: 1.6;
        }

        /* 丛林纹理背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(34, 85, 34, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(20, 60, 20, 0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ========== 标题区域 ========== */
        .header {
            text-align: center;
            padding: 40px 20px;
        }

        .header h1 {
            font-size: 32px;
            color: #7cb342;
            text-shadow: 0 0 20px rgba(124, 179, 66, 0.5);
            margin-bottom: 10px;
        }

        .header p {
            color: #a5d6a7;
            font-size: 14px;
        }

        /* ========== 欢迎页 ========== */
        .welcome-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-screen .intro {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin: 20px 0;
            border: 1px solid rgba(124, 179, 66, 0.2);
        }

        .welcome-screen .intro p {
            color: #c8e6c9;
            margin-bottom: 15px;
        }

        .welcome-screen .bug-icons {
            font-size: 40px;
            margin: 30px 0;
            letter-spacing: 15px;
        }

        /* 开始按钮 */
        .btn-start {
            display: inline-block;
            padding: 16px 48px;
            background: linear-gradient(135deg, #558b2f 0%, #7cb342 100%);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(124, 179, 66, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(124, 179, 66, 0.6);
        }

        /* ========== 题目区域 ========== */
        .quiz-screen {
            display: none;
        }

        .quiz-screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 进度条 */
        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #7cb342, #9ccc65);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #81c784;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* 题目卡片 */
        .question-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(124, 179, 66, 0.2);
        }

        .question-number {
            color: #7cb342;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 20px;
            color: #fff;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* 选项按钮 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(124, 179, 66, 0.3);
            border-radius: 12px;
            color: #c8e6c9;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: rgba(124, 179, 66, 0.2);
            border-color: #7cb342;
            transform: translateX(5px);
        }

        .option-btn:active {
            transform: translateX(5px) scale(0.98);
        }

        /* ========== 结果页 ========== */
        .result-screen {
            display: none;
        }

        .result-screen.active {
            display: block;
            animation: fadeIn 0.8s ease;
        }

        /* 你的昆虫人格 */
        .result-main {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            margin-bottom: 30px;
            border: 2px solid rgba(124, 179, 66, 0.3);
        }

        .result-bug-icon {
            font-size: 100px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .result-title {
            color: #7cb342;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .result-bug-name {
            font-size: 48px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(124, 179, 66, 0.5);
        }

        .result-tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .tag {
            background: rgba(124, 179, 66, 0.2);
            border: 1px solid rgba(124, 179, 66, 0.5);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #a5d6a7;
        }

        .result-description {
            color: #c8e6c9;
            font-size: 16px;
            line-height: 1.8;
            max-width: 450px;
            margin: 0 auto;
        }

        /* 天敌揭示 */
        .nemesis-section {
            background: linear-gradient(180deg, rgba(139, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.4) 100%);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            border: 2px solid rgba(139, 69, 69, 0.4);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .nemesis-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(139, 0, 0, 0.2) 0%, transparent 70%);
            pointer-events: none;
        }

        .nemesis-label {
            color: #ef5350;
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .nemesis-icon {
            font-size: 80px;
            margin-bottom: 15px;
        }

        .nemesis-name {
            font-size: 36px;
            color: #ff8a80;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .nemesis-reason {
            color: #ffab91;
            font-size: 16px;
            line-height: 1.7;
            font-style: italic;
            max-width: 400px;
            margin: 0 auto;
        }

        /* 其他昆虫得分 */
        .other-results {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .other-results h3 {
            color: #7cb342;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .mini-result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .mini-result:last-child {
            margin-bottom: 0;
        }

        .mini-result .bug-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-result .bug-icon {
            font-size: 24px;
        }

        .mini-result .bug-name {
            color: #c8e6c9;
        }

        .mini-result .score {
            color: #7cb342;
            font-weight: bold;
        }

        /* 重新测试按钮 */
        .btn-restart {
            display: block;
            width: 100%;
            padding: 16px;
            background: transparent;
            border: 2px solid #7cb342;
            border-radius: 30px;
            color: #7cb342;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-restart:hover {
            background: #7cb342;
            color: #0a1f0a;
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 26px;
            }

            .question-text {
                font-size: 18px;
            }

            .result-bug-name {
                font-size: 36px;
            }

            .nemesis-name {
                font-size: 28px;
            }

            .question-card {
                padding: 20px;
            }
        }

        /* 隐藏类 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>🐛 昆虫人格测试</h1>
            <p>探索你内心深处的昆虫原型</p>

        // ========== 测试状态 ==========
        let currentQuestion = 0;
        let scores = {};
        let answeredQuestions = [];

        // 初始化分数
        function initScores() {
            Object.keys(BUGS).forEach(bug => {
                scores[bug] = 0;
            });
        }

        // 开始测试
        function startQuiz() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.add('active');
            initScores();
            currentQuestion = 0;
            showQuestion();
        }

        // 显示题目
        function showQuestion() {
            const question = QUESTIONS[currentQuestion];
            document.getElementById('questionNumber').textContent = `Q${currentQuestion + 1}`;
            document.getElementById('questionText').textContent = question.text;

            const progress = ((currentQuestion + 1) / QUESTIONS.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `第 ${currentQuestion + 1}/${QUESTIONS.length} 题`;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.text;
                btn.onclick = () => selectOption(option.bug);
                optionsContainer.appendChild(btn);
            });
        }

        // 选择选项
        function selectOption(bug) {
            scores[bug]++;
            answeredQuestions.push(currentQuestion);
            currentQuestion++;

            if (currentQuestion < QUESTIONS.length) {
                showQuestion();
            } else {
                showResults();
            }
        }

        // 显示结果
        function showResults() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');

            // 找出最高分的昆虫
            let maxBug = '';
            let maxScore = 0;
            Object.entries(scores).forEach(([bug, score]) => {
                if (score > maxScore) {
                    maxScore = score;
                    maxBug = bug;
                }
            });

            const bugData = BUGS[maxBug];
            const nemesis = NEMESIS[bugData.name];

            // 显示主要结果
            document.getElementById('resultBugIcon').textContent = bugData.icon;
            document.getElementById('resultBugName').textContent = bugData.name;
            document.getElementById('resultDescription').textContent = bugData.description;

            // 显示标签
            const tagsContainer = document.getElementById('resultTags');
            tagsContainer.innerHTML = '';
            bugData.tags.forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = 'tag';
                tagEl.textContent = tag;
                tagsContainer.appendChild(tagEl);
            });

            // 显示天敌
            document.getElementById('nemesisIcon').textContent = nemesis.icon;
            document.getElementById('nemesisName').textContent = nemesis.name;
            document.getElementById('nemesisReason').textContent = `"${nemesis.reason}"`;

            // 显示其他昆虫匹配度
            const otherResults = document.getElementById('otherResults');
            otherResults.innerHTML = '';

            const sortedBugs = Object.entries(scores)
                .filter(([bug, score]) => bug !== maxBug)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            sortedBugs.forEach(([bug, score]) => {
                const bugInfo = BUGS[bug];
                const div = document.createElement('div');
                div.className = 'mini-result';
                div.innerHTML = `
                    <div class="bug-info">
                        <span class="bug-icon">${bugInfo.icon}</span>
                        <span class="bug-name">${bugInfo.name}</span>
                    </div>
                    <span class="score">${score}分</span>
                `;
                otherResults.appendChild(div);
            });

            // 滚动到顶部
            window.scrollTo(0, 0);
        }

        function restartQuiz() {
